name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    uses: EggIncTools/EggIdentity/.github/workflows/build-identity.yml@main

  test:
    needs: identity
    uses: EggIncTools/EggIdentity/.github/workflows/dotnet-ci.yml@main
    with:
      solution: EggSharp.slnx
      dotnet-version: "11.0.x"
      format-gate: true
      packages-auth: true
      build-height: ${{ needs.identity.outputs.height }}
      build-sha: ${{ needs.identity.outputs.sha }}
    secrets:
      PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}

  pack:
    needs: identity
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    uses: EggIncTools/EggIdentity/.github/workflows/nuget-publish.yml@main
    with:
      solution: EggSharp.slnx
      packages-auth: true
      build-height: ${{ needs.identity.outputs.height }}
      build-sha: ${{ needs.identity.outputs.sha }}
    secrets:
      PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}

  nuget-org:
    needs: [test, pack]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nupkgs
          path: nupkgs

      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

  notify-packages:
    needs: [identity, test, pack]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    uses: EggIncTools/EggIdentity/.github/workflows/notify-deploy.yml@main
    with:
      app: eggsharp
      hook-url: https://id.egginc.tools
      hook-path: /hooks/packages-published
      revision: ${{ needs.identity.outputs.sha }}
      version: ${{ needs.identity.outputs.version }}
      height: ${{ needs.identity.outputs.height }}
      packages: ${{ needs.pack.outputs.packages }}
    secrets:
      hook-secret: ${{ secrets.DEPLOY_HOOK_SECRET }}
