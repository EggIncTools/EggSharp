name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    uses: EggIncTools/EggIdentity/.github/workflows/build-identity.yml@main

  test:
    needs: identity
    uses: EggIncTools/EggIdentity/.github/workflows/dotnet-ci.yml@main
    with:
      solution: EggSharp.slnx
      dotnet-version: "11.0.x"
      format-gate: true
      packages-auth: true
      build-height: ${{ needs.identity.outputs.height }}
      build-sha: ${{ needs.identity.outputs.sha }}
    secrets:
      PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}

  pack:
    needs: [identity, test]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    uses: EggIncTools/EggIdentity/.github/workflows/nuget-publish.yml@main
    with:
      solution: EggSharp.slnx
      packages-auth: true
      build-height: ${{ needs.identity.outputs.height }}
      build-sha: ${{ needs.identity.outputs.sha }}
    secrets:
      PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}

  notify-packages:
    needs: [identity, pack]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    uses: EggIncTools/EggIdentity/.github/workflows/notify-deploy.yml@main
    with:
      app: eggsharp
      hook-url: https://id.egginc.tools
      hook-path: /hooks/packages-published
      revision: ${{ needs.identity.outputs.sha }}
      version: ${{ needs.identity.outputs.version }}
      height: ${{ needs.identity.outputs.height }}
      packages: ${{ needs.pack.outputs.packages }}
    secrets:
      hook-secret: ${{ secrets.DEPLOY_HOOK_SECRET }}
